name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Browser checks run against the built site, the exact files that get deployed.
      - run: node --test --test-skip-pattern="hard press" "test/e2e/*.test.mjs"
        env:
          E2E_DIR: dist
      # Frame-rate dependent on the software-rendered CI browser: reported, but never blocks a deploy.
      - run: node --test --test-name-pattern="hard press" "test/e2e/smoke.test.mjs"
        continue-on-error: true
        env:
          E2E_DIR: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Only main deploys, and only after every test above passed.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
